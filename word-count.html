<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
    }

    .word-counter-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      width: 300px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5%;
      margin-right: 20px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    p {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="word-counter-container">
    <h1>Word Counter</h1>
    <textarea id="textArea" placeholder="Type your text here"></textarea>
    <button id="countButton">Count Words</button>
    <p id="wordCount">
      Word count: 0
    </p>
  </div>

  <script>
    const textArea = document.getElementById("textArea");
    const countButton = document.getElementById("countButton");
    const wordCountDisplay = document.getElementById("wordCount");

    countButton.addEventListener("click", updateWordCount);

    function updateWordCount() {
      const text = textArea.value.trim(); // Remove leading/trailing spaces
      const words = text.split(/\s+/).filter(word => word !== ""); // Split by spaces and remove empty words
        const wordCount = words.length;

        wordCountDisplay.textContent = `Word count: ${wordCount}`;
      }
    </script>
  </body>
</html>
